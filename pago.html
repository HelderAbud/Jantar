<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pagamento recebido — Jantar Link</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at 20% 10%, #3b1d4a, #120c18 55%);
      color: #f8f4ff;
      padding: 24px;
    }
    .card {
      width: min(420px, 100%);
      padding: 28px 22px;
      border-radius: 24px;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.18);
      text-align: center;
    }
    h1 { font-size: 1.35rem; margin: 0 0 10px; }
    p { margin: 0 0 12px; line-height: 1.45; color: #d9cce8; font-size: 15px; }
    a {
      display: block;
      margin-top: 10px;
      padding: 12px 14px;
      border-radius: 14px;
      background: #f4c2d7;
      color: #3b1430;
      text-decoration: none;
      font-weight: 700;
    }
    .ghost { background: transparent; color: #f8f4ff; border: 1px solid rgba(255,255,255,.28); }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="title">Pagamento concluído</h1>
    <p id="msg">Abrindo o editor Pro…</p>
    <a id="local" href="./?modo=editor">Abrir o editor Pro</a>
    <a id="pages" class="ghost" href="./?modo=venda">Continuar neste site</a>
  </div>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var order = params.get('order') || '';
      var status = (params.get('status') || 'success').toLowerCase();
      var title = document.getElementById('title');
      var msg = document.getElementById('msg');
      var local = document.getElementById('local');
      var pages = document.getElementById('pages');
      var onPages = location.hostname === 'helderabud.github.io';
      var dir = location.pathname.replace(/pago\.html$/i, '');
      if (dir && dir.charAt(dir.length - 1) !== '/') dir += '/';
      var pagesUrl = location.origin + dir + '?modo=venda' + (order ? ('&pago=1&order=' + encodeURIComponent(order)) : '');
      var localUrl = 'http://127.0.0.1:5177/index.html?modo=venda' + (order ? ('&pago=1&order=' + encodeURIComponent(order) + '&api=cf') : '&api=cf');
      var nextUrl = onPages ? pagesUrl : localUrl;
      local.href = nextUrl;
      pages.href = pagesUrl;

      if (status === 'failure') {
        title.textContent = 'Pagamento não concluído';
        msg.textContent = 'Pode fechar esta aba e tentar de novo no Jantar Link.';
      } else if (status === 'pending') {
        title.textContent = 'Pagamento pendente';
        msg.textContent = 'Quando o Mercado Pago confirmar, o editor abre neste site.';
      } else {
        msg.textContent = onPages
          ? 'Abrindo o editor Pro neste site (nomes + 1 envio)…'
          : 'Abrindo o editor Pro no seu computador…';
        location.replace(nextUrl);
      }

      try {
        if (window.opener && order) {
          var payload = { type: 'jl-mp-paid', orderId: order, status: status };
          ['https://helderabud.github.io', 'http://127.0.0.1:5177', 'http://localhost:5177'].forEach(function (origin) {
            try { window.opener.postMessage(payload, origin); } catch (ignore) {}
          });
        }
      } catch (e) {}
    })();
  </script>
</body>
</html>
