name: Worker tests

on:
  pull_request:
  push:
    branches: [Main, main]
    paths:
      - 'commerce/worker/**'
      - '.github/workflows/worker-test.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: commerce/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run worker tests
        run: npm test
